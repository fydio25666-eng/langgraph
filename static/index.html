<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>智能客服</title>
  <style>
    :root { color-scheme: light; --ink:#17202a; --muted:#687381; --line:#e4e8ed; --brand:#2563eb; --panel:#fff; --bg:#f5f7fa; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); color:var(--ink); font:15px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif; }
    .shell { display:flex; flex-direction:column; height:100vh; max-width:960px; margin:auto; background:var(--panel); box-shadow:0 10px 40px #17202a12; }
    header { display:flex; align-items:center; justify-content:space-between; padding:16px 22px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:11px; font-weight:700; letter-spacing:.2px; }
    .mark { display:grid; place-items:center; width:34px; height:34px; border-radius:10px; background:var(--brand); color:white; font-weight:800; }
    .sub { color:var(--muted); font-size:12px; font-weight:400; }
    button { border:0; cursor:pointer; font:inherit; }
    .reset { padding:8px 12px; border:1px solid var(--line); border-radius:8px; color:var(--muted); background:white; }
    .reset:hover { border-color:var(--brand); color:var(--brand); }
    main { display:flex; flex:1; min-height:0; flex-direction:column; }
    #messages { flex:1; overflow:auto; padding:28px clamp(16px,5vw,54px); }
    .welcome { margin:15vh auto 0; max-width:500px; text-align:center; color:var(--muted); }
    .welcome h1 { margin:0 0 8px; color:var(--ink); font-size:25px; }
    .row { display:flex; margin:16px 0; }
    .row.user { justify-content:flex-end; }
    .bubble { max-width:min(75%,620px); padding:10px 14px; border-radius:14px; white-space:pre-wrap; word-break:break-word; }
    .assistant .bubble { background:#f0f3f7; border-bottom-left-radius:4px; }
    .user .bubble { background:var(--brand); color:white; border-bottom-right-radius:4px; }
    .sources { margin-top:7px; color:var(--muted); font-size:11px; }
    .composer { padding:14px clamp(16px,5vw,54px) 18px; border-top:1px solid var(--line); }
    .token { display:flex; gap:8px; margin-bottom:9px; }
    input, textarea { width:100%; border:1px solid var(--line); border-radius:9px; outline:none; background:white; color:var(--ink); font:inherit; }
    input { padding:8px 10px; font-size:12px; }
    textarea { min-height:48px; max-height:140px; padding:11px 46px 11px 13px; resize:none; }
    input:focus, textarea:focus { border-color:var(--brand); box-shadow:0 0 0 3px #2563eb18; }
    .entry { position:relative; }
    .send { position:absolute; right:8px; bottom:8px; width:32px; height:32px; border-radius:8px; background:var(--brand); color:white; }
    .send:disabled { cursor:not-allowed; opacity:.45; }
    .status { min-height:20px; color:var(--muted); font-size:12px; }
    @media (max-width:600px) { .shell { box-shadow:none; } .bubble { max-width:88%; } header { padding:13px 15px; } }
  </style>
</head>
<body>
  <section class="shell">
    <header>
      <div class="brand"><span class="mark">AI</span><span>智能客服 <span class="sub">售前 · 售后</span></span></div>
      <button class="reset" id="reset" type="button">重置会话</button>
    </header>
    <main>
      <div id="messages"><div class="welcome" id="welcome"><h1>你好，需要咨询什么？</h1><p>可以询问商品信息、库存、物流或售后政策。</p></div></div>
      <section class="composer">
        <div class="token"><input id="token" type="password" placeholder="输入 API Token 后开始对话" autocomplete="off"></div>
        <div class="entry"><textarea id="question" rows="1" placeholder="输入你的问题，Enter 发送，Shift+Enter 换行"></textarea><button class="send" id="send" type="button" aria-label="发送">↑</button></div>
        <div class="status" id="status"></div>
      </section>
    </main>
  </section>
  <script>
    const messages = document.getElementById('messages');
    const welcome = document.getElementById('welcome');
    const question = document.getElementById('question');
    const token = document.getElementById('token');
    const send = document.getElementById('send');
    const reset = document.getElementById('reset');
    const status = document.getElementById('status');
    let threadId = localStorage.getItem('support-thread-id') || crypto.randomUUID();
    token.value = localStorage.getItem('support-api-token') || '';

    function addBubble(role, text = '') {
      welcome.hidden = true;
      const row = document.createElement('div'); row.className = `row ${role}`;
      const bubble = document.createElement('div'); bubble.className = 'bubble'; bubble.textContent = text;
      row.appendChild(bubble); messages.appendChild(row); messages.scrollTop = messages.scrollHeight;
      return bubble;
    }
    function setStatus(text) { status.textContent = text; }
    function resetSession() {
      threadId = crypto.randomUUID(); localStorage.setItem('support-thread-id', threadId);
      messages.replaceChildren(welcome); welcome.hidden = false; setStatus('已开启新会话');
    }
    async function sendMessage() {
      const text = question.value.trim();
      const auth = token.value.trim();
      if (!text || !auth || send.disabled) { if (!auth) setStatus('请先输入 API Token'); return; }
      localStorage.setItem('support-api-token', auth); question.value = ''; question.style.height = 'auto';
      addBubble('user', text); const answer = addBubble('assistant', '');
      send.disabled = true; setStatus('正在思考…');
      try {
        const response = await fetch('/chat', { method:'POST', headers:{'Content-Type':'application/json','Authorization':`Bearer ${auth}`}, body:JSON.stringify({question:text,thread_id:threadId,stream:true}) });
        if (!response.ok) { const body = await response.json().catch(() => ({})); throw new Error(body.detail || body.error || `请求失败（${response.status}）`); }
        const reader = response.body.getReader(); const decoder = new TextDecoder(); let buffer = '';
        while (true) {
          const part = await reader.read(); if (part.done) break; buffer += decoder.decode(part.value, {stream:true});
          const frames = buffer.split('\n\n'); buffer = frames.pop();
          for (const frame of frames) {
            const line = frame.split('\n').find(item => item.startsWith('data:')); if (!line) continue;
            const payload = JSON.parse(line.slice(5).trim()); const result = payload.result || {};
            if (result.reply) answer.textContent = result.reply;
            if (result.sources?.length) { const source = document.createElement('div'); source.className='sources'; source.textContent=`来源：${result.sources.join('、')}`; answer.appendChild(source); }
          }
          messages.scrollTop = messages.scrollHeight;
        }
        setStatus('');
      } catch (error) { answer.textContent = `暂时无法完成请求：${error.message}`; setStatus('请检查 Token 或服务状态'); }
      finally { send.disabled = false; question.focus(); }
    }
    send.addEventListener('click', sendMessage); reset.addEventListener('click', resetSession);
    question.addEventListener('keydown', event => { if (event.key === 'Enter' && !event.shiftKey) { event.preventDefault(); sendMessage(); } });
    question.addEventListener('input', () => { question.style.height='auto'; question.style.height=Math.min(question.scrollHeight,140)+'px'; });
  </script>
</body>
</html>
