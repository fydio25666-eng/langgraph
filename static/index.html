<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#202123">
<title>明顺智能客服</title>
<style>
:root{--side:#202123;--side2:#2a2b32;--bg:#fff;--soft:#f7f7f8;--ink:#202123;--muted:#737780;--line:#e5e7eb;--green:#10a37f;--shadow:0 10px 30px #0f172a14}*{box-sizing:border-box}html,body{height:100%;margin:0}body{overflow:hidden;color:var(--ink);background:var(--bg);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer}.app{display:flex;height:100vh}.side{display:flex;width:270px;flex-direction:column;gap:16px;padding:15px 12px;color:#f5f5f5;background:var(--side)}.brand{display:flex;align-items:center;gap:10px;padding:2px 5px}.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;color:#fff;background:var(--green);font-size:11px;font-weight:800}.brand b{font-size:14px}.brand small{display:block;color:#a5a7ad;font-size:11px}.new{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid #565861;border-radius:8px;color:#fff;background:transparent;text-align:left}.new:hover,.history button:hover{background:var(--side2)}.new strong{font-size:20px;font-weight:300}.label{padding:0 9px;color:#a5a7ad;font-size:11px;font-weight:700;letter-spacing:.06em}.history{flex:1;overflow:auto}.history button{display:block;width:100%;padding:10px;border:0;border-radius:7px;color:#e5e7eb;background:transparent;text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.empty{padding:10px;color:#777a83;font-size:12px}.side-bottom{display:grid;gap:9px;padding-top:10px;border-top:1px solid #38393f}.token-box{display:grid;gap:6px;padding:9px;border-radius:8px;background:#292a2f}.token-box span{color:#a5a7ad;font-size:11px}.token{width:100%;padding:7px 8px;border:1px solid #4a4b52;border-radius:6px;outline:0;color:#fff;background:#202123;font-size:12px}.token:focus{border-color:var(--green)}.clear{border:0;color:#a5a7ad;background:transparent;text-align:left;font-size:12px}.main{display:flex;flex:1;min-width:0;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;height:58px;padding:0 24px;border-bottom:1px solid var(--line)}.top-title{display:flex;align-items:center;gap:9px;font-weight:650}.badge{padding:4px 8px;border:1px solid var(--line);border-radius:6px;color:var(--muted);font-size:11px;font-weight:500}.actions{display:flex;gap:4px}.icon{display:grid;place-items:center;width:32px;height:32px;border:0;border-radius:8px;color:var(--muted);background:transparent;font-size:19px}.icon:hover{background:var(--soft)}.mobile{display:none}.content{position:relative;display:flex;flex:1;min-height:0;flex-direction:column}.messages{flex:1;overflow:auto}.welcome{width:min(760px,calc(100% - 32px));margin:auto;padding:8vh 0 13vh;text-align:center}.welcome-logo{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 18px;border-radius:16px;color:#fff;background:var(--green);box-shadow:0 8px 20px #10a37f38;font-weight:800}.welcome h1{margin:0;font-size:34px;letter-spacing:-.02em}.welcome p{margin:9px 0 28px;color:var(--muted)}.suggestions{display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left}.suggestion{padding:13px 14px;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:var(--bg);text-align:left;transition:.15s}.suggestion:hover{border-color:var(--green);box-shadow:var(--shadow);transform:translateY(-1px)}.suggestion b{display:block;margin-bottom:3px;font-size:13px}.suggestion span{color:var(--muted);font-size:12px}.list{width:min(850px,calc(100% - 32px));margin:0 auto;padding:26px 0 150px}.row{display:flex;gap:13px;padding:20px 0}.avatar{display:grid;place-items:center;width:30px;height:30px;flex:0 0 30px;border-radius:8px;color:#fff;background:var(--green);font-size:10px;font-weight:800}.user{justify-content:flex-end}.user .avatar{order:2;background:#555b66}.body{max-width:720px;min-width:0}.name{margin-bottom:4px;color:var(--muted);font-size:11px;font-weight:650}.text{white-space:pre-wrap;word-break:break-word}.user .body{max-width:80%;padding:10px 13px;border-radius:12px;color:#fff;background:#343541}.user .name{display:none}.sources{margin-top:10px;padding-top:8px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.typing{display:inline-flex;gap:4px}.typing i{width:5px;height:5px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes blink{0%,60%,100%{opacity:.25}30%{opacity:1}}.composer-area{position:absolute;right:0;bottom:0;left:0;padding:22px 16px 18px;background:linear-gradient(transparent,var(--bg) 25%)}.composer{width:min(850px,100%);margin:auto}.entry{display:flex;align-items:flex-end;padding:8px 9px 8px 14px;border:1px solid var(--line);border-radius:13px;background:var(--bg);box-shadow:var(--shadow)}.entry:focus-within{border-color:var(--green);box-shadow:0 0 0 3px #10a37f1f,var(--shadow)}textarea{width:100%;min-height:26px;max-height:160px;padding:5px 8px 5px 0;border:0;outline:0;resize:none;color:var(--ink);background:transparent}textarea::placeholder{color:#9ca3af}.send{display:grid;place-items:center;width:32px;height:32px;flex:0 0 32px;border:0;border-radius:8px;color:#fff;background:var(--green);font-size:20px}.send:hover{background:#0d8a6c}.send:disabled{opacity:.4}.foot{display:flex;justify-content:space-between;padding:8px 4px 0;color:var(--muted);font-size:11px}.status{min-height:17px}@media(max-width:760px){.side{position:fixed;z-index:5;top:0;bottom:0;left:0;transform:translateX(-100%);transition:transform .2s;box-shadow:12px 0 28px #0003}.side.open{transform:translateX(0)}.mobile{display:grid}.top{padding:0 14px}.list{width:calc(100% - 28px);padding-top:14px}.welcome{padding-top:7vh}.welcome h1{font-size:27px}.suggestions{grid-template-columns:1fr}.user .body{max-width:86%}.composer-area{padding-right:12px;padding-left:12px}}
</style>
</head>
<body>
<div class="app"><aside class="side" id="side"><div class="brand"><span class="logo">AI</span><div><b>明顺智能客服</b><small>五金 · 家居 · 汽车配件</small></div><button class="icon mobile" id="close" title="关闭">×</button></div><button class="new" id="new"><strong>＋</strong><span>新建对话</span></button><div class="label">最近对话</div><div class="history" id="history"><div class="empty">还没有历史对话</div></div><div class="side-bottom"><label class="token-box"><span>API Token</span><input class="token" id="token" type="password" placeholder="输入后开始对话" autocomplete="off"></label><button class="clear" id="clear">⌫ 清除本地 Token</button></div></aside><section class="main"><header class="top"><div class="top-title"><button class="icon mobile" id="open" title="打开菜单">☰</button><span>客服助手</span><span class="badge">知识库增强</span></div><div class="actions"><button class="icon" id="theme" title="切换主题">☼</button><button class="icon" id="reset" title="新建对话">↗</button></div></header><main class="content"><div class="messages" id="messages"><section class="welcome" id="welcome"><div class="welcome-logo">AI</div><h1>你好，我是明顺客服</h1><p>我可以帮你查询五金商品、安装参数、物流和售后政策。</p><div class="suggestions"><button class="suggestion" data-q="现货商品什么时候发货？"><b>发货时效</b><span>现货订单多久可以发出？</span></button><button class="suggestion" data-q="50主龙骨吊件能承重多少？"><b>产品参数</b><span>查询龙骨配件承重和规格</span></button><button class="suggestion" data-q="免打孔胶贴好后多久能放东西？"><b>安装指导</b><span>了解置物架安装和固化时间</span></button><button class="suggestion" data-q="更换减振顶胶后需要四轮定位吗？"><b>汽车配件</b><span>咨询顶胶匹配和施工要求</span></button></div></section><div class="list" id="list"></div></div><div class="composer-area"><section class="composer"><div class="entry"><textarea id="question" rows="1" placeholder="给明顺客服发送消息…" aria-label="输入问题"></textarea><button class="send" id="send" title="发送">↑</button></div><div class="foot"><span class="status" id="status"></span><span>回复可能存在偏差，请以人工核实为准</span></div></section></div></main></section></div>
<script>
const side=document.getElementById('side'),messages=document.getElementById('messages'),list=document.getElementById('list'),welcome=document.getElementById('welcome'),question=document.getElementById('question'),token=document.getElementById('token'),send=document.getElementById('send'),status=document.getElementById('status'),history=document.getElementById('history');
let threadId=localStorage.getItem('support-thread-id')||crypto.randomUUID();token.value=localStorage.getItem('support-api-token')||'';
function setStatus(value){status.textContent=value}function scroll(){messages.scrollTop=messages.scrollHeight}function add(role,text){welcome.hidden=true;const row=document.createElement('div');row.className='row '+role;const avatar=document.createElement('div');avatar.className='avatar';avatar.textContent=role==='user'?'你':'AI';const body=document.createElement('div');body.className='body';const name=document.createElement('div');name.className='name';name.textContent=role==='user'?'你':'明顺客服';const content=document.createElement('div');content.className='text';content.textContent=text;body.append(name,content);row.append(avatar,body);list.appendChild(row);scroll();return{body:body,text:content}}
function typing(){const item=add('assistant','');item.text.innerHTML='<span class="typing"><i></i><i></i><i></i></span>';return item}function sources(item,items){if(!items||!items.length||item.body.querySelector('.sources'))return;const node=document.createElement('div');node.className='sources';node.textContent='来源：'+items.join('、');item.body.appendChild(node)}
function renderHistory(){const items=JSON.parse(localStorage.getItem('support-history')||'[]');history.replaceChildren();if(!items.length){history.innerHTML='<div class="empty">还没有历史对话</div>';return}items.slice(0,12).forEach(item=>{const button=document.createElement('button');button.textContent=item;button.title=item;button.onclick=()=>{question.value=item;question.focus();side.classList.remove('open')};history.appendChild(button)})}
function saveHistory(text){const items=JSON.parse(localStorage.getItem('support-history')||'[]').filter(item=>item!==text);items.unshift(text);localStorage.setItem('support-history',JSON.stringify(items.slice(0,12)));renderHistory()}
function resetSession(){threadId=crypto.randomUUID();localStorage.setItem('support-thread-id',threadId);list.replaceChildren();welcome.hidden=false;setStatus('已开启新会话');question.focus()}
async function sendMessage(){const text=question.value.trim(),auth=token.value.trim();if(!text||!auth||send.disabled){if(!auth)setStatus('请先在左侧输入 API Token');return}localStorage.setItem('support-api-token',auth);saveHistory(text);question.value='';question.style.height='auto';add('user',text);const answer=typing();send.disabled=true;setStatus('正在思考…');try{const response=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+auth},body:JSON.stringify({question:text,thread_id:threadId,stream:true})});if(!response.ok){const body=await response.json().catch(()=>({}));throw new Error(body.detail||body.error||'请求失败（'+response.status+'）')}const reader=response.body.getReader(),decoder=new TextDecoder();let buffer='',hasReply=false;while(true){const part=await reader.read();if(part.done)break;buffer+=decoder.decode(part.value,{stream:true});const frames=buffer.split('\n\n');buffer=frames.pop();for(const frame of frames){const line=frame.split('\n').find(item=>item.startsWith('data:'));if(!line)continue;const payload=JSON.parse(line.slice(5).trim()),result=payload.result||{};if(result.reply){answer.text.textContent=result.reply;hasReply=true}sources(answer,result.sources)}scroll()}if(!hasReply)answer.text.textContent='暂时没有生成有效回复，请稍后重试。';setStatus('')}catch(error){answer.text.textContent='暂时无法完成请求：'+error.message;setStatus('请检查 Token 或服务状态')}finally{send.disabled=false;question.focus()}}
document.querySelectorAll('[data-q]').forEach(button=>button.onclick=()=>{question.value=button.dataset.q;question.focus()});document.getElementById('new').onclick=resetSession;document.getElementById('reset').onclick=resetSession;document.getElementById('clear').onclick=()=>{token.value='';localStorage.removeItem('support-api-token');setStatus('已清除本地 Token')};document.getElementById('open').onclick=()=>side.classList.add('open');document.getElementById('close').onclick=()=>side.classList.remove('open');document.getElementById('theme').onclick=()=>{document.body.classList.toggle('dark');setStatus('主题已切换')};send.onclick=sendMessage;question.onkeydown=event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}};question.oninput=()=>{question.style.height='auto';question.style.height=Math.min(question.scrollHeight,160)+'px'};renderHistory();
</script></body></html>
